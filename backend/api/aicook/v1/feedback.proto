syntax = "proto3";

package aicook.v1;

option go_package = "github.com/chengjiang/aicook/backend/api/aicook/v1;v1";

import "google/api/annotations.proto";

// FeedbackService 用户意见反馈：用户提交反馈（类型/正文/截图/联系方式），
// 并可在「我的反馈」里回看自己提交过的反馈及处理状态/运营回复。
service FeedbackService {
  // CreateFeedback 提交一条反馈。
  rpc CreateFeedback(CreateFeedbackRequest) returns (CreateFeedbackReply) {
    option (google.api.http) = {
      post: "/api/v1/feedbacks"
      body: "*"
    };
  }

  // ListFeedbacks 拉取当前用户自己的反馈列表，按 id 倒序游标分页。
  rpc ListFeedbacks(ListFeedbacksRequest) returns (ListFeedbacksReply) {
    option (google.api.http) = {get: "/api/v1/feedbacks"};
  }
}

// Feedback 单条反馈。category/status 用字符串（与全仓 proto 约定一致，不用 enum）。
// category: "suggestion" | "bug" | "other"
// status:   "pending" | "replied" | "closed"
message Feedback {
  int64 id = 1;
  string category = 2;
  string content = 3;
  // image_urls 读时由服务端按 asset 重新签名后下发（前端直接展示）。
  repeated string image_urls = 4;
  string contact = 5;
  string status = 6;
  // admin_reply / replied_at 为运营回复，暂无后台 UI，字段预留供「我的反馈」展示。
  string admin_reply = 7;
  string replied_at = 8;  // RFC3339；未回复时为空串
  string created_at = 9;  // RFC3339
}

message CreateFeedbackRequest {
  string category = 1;
  string content = 2;
  // image_asset_ids 为两步直传完成后的 media_assets.id 列表（截图），服务端读时再签名。
  repeated int64 image_asset_ids = 3;
  string contact = 4;
}

message CreateFeedbackReply {
  Feedback feedback = 1;
}

message ListFeedbacksRequest {
  int32 limit = 1;
  int64 before_id = 2;  // 上一页最后一条的 id，用于游标分页
}

message ListFeedbacksReply {
  repeated Feedback feedbacks = 1;
  int64 next_cursor = 2;
}
