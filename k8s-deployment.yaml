apiVersion: v1
kind: Namespace
metadata:
  name: aicook
---
# 说明：本仓库清单【不含】Secret。密钥放在 k8s Secret `aicook-secrets`（namespace: aicook），
# 由部署脚本交互式录入并创建/更新：
#   Windows : .\publish.ps1 -UpdateSecrets
#   WSL/bash: UPDATE_SECRETS=1 ./publish.sh backend
# 下面 ConfigMap 里的 ${VAR} 占位符由后端在启动加载配置时、用该 Secret 注入的同名环境变量替换；
# 若有占位符没对应环境变量，后端会启动即报错（点名缺失的键），不会拿占位符当密钥静默运行。
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: aicook
data:
  config.yaml: |
    server:
      name: aicook-backend
      http:
        addr: 0.0.0.0:8000
        timeout: 1000s
      grpc:
        addr: 0.0.0.0:9000
        timeout: 1000s
    data:
      pg_database:
        host: sshjd.aihelper.chat
        port: 30532
        user: pgadmin
        password: "${PG_PASSWORD}"
        dbname: pgdb
        sslmode: disable
        schema: aicook
        # 生产关闭自动迁移（避免启动时改库结构）；本地 config.yaml 用 true 方便开发，二者刻意不同。
        auto_migrate: false
      redis:
        addr: sshjd.aihelper.chat:30379
        # 远端公网 Redis（跨网访问）：0.2s 过紧，任何网络抖动都会 i/o timeout，
        # 导致审批续跑 checkpoint 读失败、对话报错。放宽到 3s 留足往返余量。
        read_timeout: 3s
        write_timeout: 3s
        password: "${REDIS_PASSWORD}"
    oss:
      # 外部 MinIO（位于 Cloudflare 之后，单独部署，不在本集群内）。
      # endpoint（后端直连）与 public_endpoint（前端访问/预签名）必须同域名，
      # 否则预签名 URL 的 host 重写会让签名失效。
      endpoint: minio.aihelper.chat
      public_endpoint: https://minio.aihelper.chat
      access_key: "${MINIO_ACCESS_KEY}"
      secret_key: "${MINIO_SECRET_KEY}"
      use_ssl: true
      media_bucket: aicook-media
      knowledge_bucket: aicook-kb
    auth:
      # JWT HMAC 签名密钥（由 Secret 注入）。
      jwt_secret: "${JWT_SECRET}"
      # token 有效期（protobuf Duration 仅接受秒，24h=86400s）；<=0 时回退为 24h。
      token_ttl: 86400s
    log:
      path: /app/logs
      filename: aicook.log
      level: info
    ai:
      mode: adk
      # Xiaomi MiMo 兼容 OpenAI Chat Completions。
      provider: xiaomi
      base_url: "https://api.xiaomimimo.com/v1"
      api_key: "${MIMO_API_KEY}"
      # 纯文本默认走轻量文本模型；上传图片/音频自动切多模态；语音用 asr。
      chat_model: "mimo-v2.5-pro"
      vision_model: "mimo-v2.5"
      asr_model: "mimo-v2.5-asr"
      request_timeout: 1000s
      embedding:
        provider:
          doubao:
            base_url: "https://ark.cn-beijing.volces.com/api/v3"
            model: "doubao-embedding-vision-251215"
            api_key: "${DOUBAO_API_KEY}"
            api_type: "multimodal"
            dimensions: 2048
    wechat:
      # appid 非密钥，明文即可；secret 由 Secret 注入。
      appid: "wxf9cdbc153c9b1bb5"
      secret: "${WX_SECRET}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: aicook
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: 7as0nch/aicook-backend:v0.1.5
          # 密钥统一从 Secret 注入为环境变量，供 config.yaml 的 ${VAR} 占位替换。
          # 注意：Secret 不存在时 Pod 会起不来（CreateContainerConfigError）——先跑脚本的 -UpdateSecrets。
          envFrom:
            - secretRef:
                name: aicook-secrets
          env:
            - name: AICOOK_CONFIG
              value: /data/conf/config.yaml
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 768Mi
          volumeMounts:
            - name: config
              mountPath: /data/conf
      volumes:
        - name: config
          configMap:
            name: backend-config
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: aicook
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aicook-ingress
  namespace: aicook
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    # 与后端 server.http.timeout=1000s 对齐，避免长耗时 AI 请求被 ingress 提前 504。
    nginx.ingress.kubernetes.io/proxy-read-timeout: "1000"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "1000"
    # /chat/send 是 SSE 流式输出，关闭 nginx 缓冲，避免攒包导致前端收不到增量。
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # cert-manager 自动签发 Let's Encrypt 证书（DNS-01 via Cloudflare），供 Cloudflare「完全(严格)」校验源站。
    cert-manager.io/cluster-issuer: "letsencrypt-cloudflare"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - aicookapi.aihelper.chat
      secretName: aicookapi-tls
  rules:
    - host: aicookapi.aihelper.chat
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
